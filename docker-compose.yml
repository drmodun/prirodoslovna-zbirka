# Starts with no .env at all; values in a root .env override the defaults.
#   docker compose up -d --build
#   docker compose run --rm seed      # wipe the database and load mock data
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: biosfera
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biosfera"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    environment: &api-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/biosfera
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_URL: ${AWS_S3_URL:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      # Without AWS_* the API keeps uploads in the volume below and serves
      # them itself at this address.
      API_PUBLIC_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5500}
    volumes:
      - uploads:/app/apps/api/uploads
    ports:
      - "${API_PORT:-5500}:5500"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:5500/api-json').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  seed:
    profiles: [seed]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: seed
    environment:
      <<: *api-env
      NODE_ENV: development
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        WEB_URL: ${WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5500}
        NEXT_PUBLIC_FILES_URL: ${NEXT_PUBLIC_FILES_URL:-}
        AWS_S3_URL: ${AWS_S3_URL:-}
        AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
        AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
        AWS_REGION: ${AWS_REGION:-}
        FILES_FALLBACK: local
    environment:
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      API_INTERNAL_URL: http://api:5500
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY:-}
      S3_PATH: ${S3_PATH:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Catches outgoing mail for local testing; inbox at http://localhost:8025.
  #   SMTP_URL=smtp://mailpit:1025 docker compose --profile mail up -d
  mailpit:
    profiles: [mail]
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  reverse-proxy:
    image: nginx:stable
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./packages/config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  db_data:
  uploads:
