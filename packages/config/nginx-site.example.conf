# Example site for a main nginx in front of this stack's Caddy
# (docker-compose.prod.yml). Adjust the server name and certificate paths,
# then pick the upstream that matches how nginx runs:
#   nginx in Docker  -> profile proxy-network; "biosfera" is PROXY_ALIAS
#   nginx on the host -> profile proxy-host; 8080 is PROXY_PORT
server {
    listen 443 ssl;
    server_name biosfera.example.com;

    ssl_certificate     /etc/letsencrypt/live/biosfera.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biosfera.example.com/privkey.pem;

    # The app accepts uploads up to 200 MB; nginx stops at 1 MB by default.
    client_max_body_size 200m;

    location / {
        # nginx in Docker, on the same network as the stack's Caddy. Resolved
        # per request through Docker's DNS, so nginx still starts (and
        # recovers) when this stack is down or restarted.
        resolver 127.0.0.11 valid=10s;
        set $biosfera http://biosfera:80;
        proxy_pass $biosfera;
        # nginx on the host: replace the three lines above with
        # proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Notifications are a long-lived event stream.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name biosfera.example.com;
    return 301 https://$host$request_uri;
}
