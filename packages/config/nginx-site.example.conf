# Example site for the main nginx when it runs in Docker on the same network
# as this stack's Caddy (docker-compose.prod.yml). Adjust the server name and
# certificate paths; "biosfera" is PROXY_ALIAS.
server {
    listen 443 ssl;
    server_name biosfera.example.com;

    ssl_certificate     /etc/letsencrypt/live/biosfera.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biosfera.example.com/privkey.pem;

    # The app accepts uploads up to 200 MB; nginx stops at 1 MB by default.
    client_max_body_size 200m;

    location / {
        # Resolved per request through Docker's DNS, so nginx still starts
        # (and recovers) when this stack is down or restarted.
        resolver 127.0.0.11 valid=10s;
        set $biosfera http://biosfera:80;
        proxy_pass $biosfera;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Notifications are a long-lived event stream.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
