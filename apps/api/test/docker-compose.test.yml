# Throw-away Postgres for the API integration tests (yarn test:integration:db).
# Deliberately separate from the dev stack: other port, other database name,
# data lives in tmpfs and disappears with the container.
name: biosfera-api-test
services:
  postgres:
    image: postgres:15
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: biosfera_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biosfera_test"]
      interval: 2s
      timeout: 3s
      retries: 30
